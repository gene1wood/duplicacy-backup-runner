# GitHub Actions workflow: build and publish duplicacy-backup-runner to
# TestPyPI and PyPI.
#
# Requires a PyPI and TestPyPI "Trusted Publisher" configured for this repo
# (no API tokens needed) — see https://docs.pypi.org/trusted-publishers/
#
# First release (the project doesn't exist on the index yet): add a
# "pending publisher". PyPI can't prefill this form from a URL, so open the
# page, paste the matching line below into the browser's devtools console,
# check the fields, and click "Add".
#   TestPyPI: https://test.pypi.org/manage/account/publishing/
#     f=document.querySelector('input[name=workflow_filename]').form;Object.entries({project_name:'duplicacy-backup-runner',owner:'gene1wood',repository:'duplicacy-backup-runner',workflow_filename:'release.yml',environment:'testpypi'}).forEach(([k,v])=>f.elements[k].value=v)
#   PyPI: https://pypi.org/manage/account/publishing/
#     f=document.querySelector('input[name=workflow_filename]').form;Object.entries({project_name:'duplicacy-backup-runner',owner:'gene1wood',repository:'duplicacy-backup-runner',workflow_filename:'release.yml',environment:'pypi'}).forEach(([k,v])=>f.elements[k].value=v)
#
# Project already exists on the index: these links open the form prefilled.
#   TestPyPI: https://test.pypi.org/manage/project/duplicacy-backup-runner/settings/publishing/?provider=github&owner=gene1wood&repository=duplicacy-backup-runner&workflow_filename=release.yml&environment=testpypi
#   PyPI:     https://pypi.org/manage/project/duplicacy-backup-runner/settings/publishing/?provider=github&owner=gene1wood&repository=duplicacy-backup-runner&workflow_filename=release.yml&environment=pypi
#
# Actions are pinned to commit hashes rather than version tags. This is a
# supply-chain-security best practice: a tag like @v4 can be force-moved to
# point at different (possibly malicious) code, but a commit hash can't be.
# The trailing comment records the human-readable version for reference.
# Keep hashes current with Dependabot (see .github/dependabot.yml below) or
# by re-checking the action's releases page periodically — these hashes
# reflect what was current when this template was last updated and WILL go
# stale over time.
#
# Save as: .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.x"

      - name: Install build tool
        run: python -m pip install --upgrade build --user

      - name: Build a binary wheel and a source tarball
        run: python -m build

      - name: Store the distribution packages
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: python-package-distributions
          path: dist/

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/duplicacy-backup-runner
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # release/v1.13
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build, publish-to-testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/duplicacy-backup-runner
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # release/v1.13
